<!DOCTYPE html>
<html>
<head>
    <title>All Donors</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .navbar {
            background: linear-gradient(to right, #c31432, #240b36);
        }

        .navbar a {
            color: white !important;
            font-weight: 500;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
        }

        .table th {
            background-color: #c31432;
            color: white;
        }

        .btn-danger {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            border: none;
        }
    </style>
</head>

<body>

<!-- 🔴 Navbar -->
<nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand text-white fw-bold" href="/">🩸 Blood Donor</a>

    <div class="ms-auto">
        <a href="/" class="mx-3">Home</a>
        <a href="/register" class="mx-3">Register</a>
        <a href="/donors" class="mx-3">View Donors</a>
        <a href="/request" class="mx-3">Request Blood</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- 🔴 Page Title -->
    <h2 class="text-danger mb-4">All Registered Donors</h2>

    <!-- 🔴 Card -->
    <div class="card p-4">

        <table class="table table-hover text-center">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Blood Group</th>
                    <th>Contact</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for d in donors %}
                <tr>
                    <td>{{d[0]}}</td>
                    <td>{{d[1]}}</td>
                    <td>{{d[2]}}</td>
                    <td>{{d[3]}}</td>
                    <td>{{d[4]}}</td>
                    <td>
                        <a href="/delete/{{d[0]}}" 
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this donor?')">
                           Delete
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
