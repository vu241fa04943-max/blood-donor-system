<!DOCTYPE html>
<html>
<head>
    <title>Blood Donor System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }

        .navbar {
            background: linear-gradient(to right, #c31432, #240b36);
        }

        .navbar a { color: white !important; }

        .hero {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            margin-top: 30px;
        }

        .btn-custom {
            margin: 10px;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<nav class="navbar p-3">
    <span class="text-white fw-bold">🩸 Blood Donor System</span>
</nav>

<div class="container">
    <div class="hero">
        <h1 class="text-danger">Donate Blood, Save Lives ❤️</h1>
        <p>Simple blood donor management system</p>

        <a href="/register" class="btn btn-danger btn-custom">Register Donor</a>
        <a href="/donors" class="btn btn-success btn-custom">View Donors</a>
        <a href="/request" class="btn btn-primary btn-custom">Request Blood</a>
    </div>
</div>

</body>
</html>
